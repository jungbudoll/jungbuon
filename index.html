<script>

   이전 버전(시상확인_v9) 파일의 예시 값을 그대로 가져온 것입니다.
   실제 배포 전 반드시 스텝이 이번 주 확정 시상 기준으로 교체·확인해야 합니다.

  //    - match : 엑셀 헤더(1행) 텍스트에 이 글자가 포함되어 있으면 이 기준을 적용합니다.

  //    - tiers : [{ amount: 실적 기준값, reward: "지급 문구", value: 지급액(숫자, 정렬/합산용), type: "cash"(현금) 또는 "product"(물품) }]

            { amount: 100000, reward: "240,000원", value: 240000, type: "cash" },
            { amount: 200000, reward: "660,000원", value: 660000, type: "cash" }
          ],
          note: "2차년도 주력상품 브릿지 참여기간 : (예시) 9월 4~5주 & 10월 1주 · 대상상품 : 퍼펙트플러스, 간편보험, 인생의품격, 굿앤굿1540, 굿앤굿스타"

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
  function fmt(n){ return Number(n).toLocaleString('ko-KR'); }
  function normCode(v){ return String(v == null ? '' : v).trim().toUpperCase(); }

  document.getElementById('hdrEyebrow').textContent = CONFIG.title + ' ' + CONFIG.subtitle;
  document.getElementById('periodDesc').textContent = CONFIG.periodText;
  document.getElementById('calcNoteText').textContent = CONFIG.calcNote;
  document.getElementById('tabBtnBumun').textContent = CONFIG.sections.bumun.tabLabel;
  document.getElementById('tabBtnJiyeokdan').textContent = CONFIG.sections.jiyeokdan.tabLabel;

  var workbookData = null; // { bumun: {headers, rowsByCode}, jiyeokdan: {headers, rowsByCode} }
  var loadFailed = false;

  function parseSheet(wb, sheetName){
    var ws = wb.Sheets[sheetName];
    if (!ws) return null;
    var rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
    if (!rows.length) return null;
    var header = rows[0];
    var itemHeaders = header.slice(5).map(function(h){ return String(h == null ? '' : h).trim(); });
    var rowsByCode = {};
    for (var i = 1; i < rows.length; i++){
      var r = rows[i];
      if (!r || r.length === 0) continue;
      var code = normCode(r[2]);
      if (!code) continue;
      rowsByCode[code] = {
        branch: r[0], team: r[1], code: r[2], name: r[3], month: r[4],
        values: itemHeaders.map(function(_, idx){
          var raw = r[5 + idx];
          var n = Number(raw);
          return isNaN(n) ? 0 : n;
        })
      };
    }
    return { headers: itemHeaders, rowsByCode: rowsByCode };
  }

  function loadData(){
    document.getElementById('inputCard').style.display = 'none';
    document.getElementById('loadErrorBox').classList.remove('show');
    document.getElementById('loadingBox').classList.add('show');

    fetch(CONFIG.dataFile, { cache: 'no-store' })
      .then(function(res){
        if (!res.ok) throw new Error('fetch failed');
        return res.arrayBuffer();
      })
      .then(function(buf){
        var wb = XLSX.read(buf, { type: 'array', cellDates: true });
        var bumun = parseSheet(wb, CONFIG.sections.bumun.sheetName);
        var jiyeokdan = parseSheet(wb, CONFIG.sections.jiyeokdan.sheetName);
        if (!bumun && !jiyeokdan) throw new Error('no sheets found');
        workbookData = { bumun: bumun, jiyeokdan: jiyeokdan };
        loadFailed = false;
        document.getElementById('loadingBox').classList.remove('show');
        document.getElementById('inputCard').style.display = '';
      })
      .catch(function(err){
        loadFailed = true;
        document.getElementById('loadingBox').classList.remove('show');
        document.getElementById('loadErrorBox').classList.add('show');
      });
  }

  document.getElementById('retryBtn').addEventListener('click', loadData);
  loadData();

  // ---- 판정 로직 ----
  function judgeTier(value, tiers){
    var achieved = null;
    for (var i=0;i<tiers.length;i++){ if (value >= tiers[i].amount) achieved = tiers[i]; }
    return achieved;
  }
  function nextTier(value, tiers){
    for (var i=0;i<tiers.length;i++){ if (value < tiers[i].amount) return tiers[i]; }
    return null;
  }

  function matchConfigItem(configItems, headerText){
    for (var i=0;i<configItems.length;i++){
      if (headerText.indexOf(configItems[i].match) !== -1) return configItems[i];
    }
    return null;
  }

  function buildSectionResult(sectionKey, record){
    var section = CONFIG.sections[sectionKey];
    var sheetData = workbookData[sectionKey];
    var items = [];
    var cashTotal = 0, productTotal = 0;
    var anyTier = false;

    if (sheetData && record){
      sheetData.headers.forEach(function(headerText, idx){
        var cfg = matchConfigItem(section.items, headerText);
        var value = record.values[idx];
        if (!cfg){
          items.push({ configured:false, label: headerText || ('항목 ' + (idx+1)), value: value });
          return;
        }
        if (cfg.type === 'threshold'){
          var achieved = value >= cfg.threshold;
          items.push({
            configured:true, type:'threshold', emoji: cfg.emoji, label: headerText || cfg.match,
            value: value, unit: cfg.unit, achieved: achieved, threshold: cfg.threshold,
            rewardText: cfg.rewardText, remain: Math.max(0, cfg.threshold - value), note: cfg.note
          });
        } else {
          anyTier = true;
          var t = judgeTier(value, cfg.tiers);
          var nt = nextTier(value, cfg.tiers);
          if (t){ if (t.type === 'cash') cashTotal += t.value; else productTotal += t.value; }
          items.push({
            configured:true, type:'tier', emoji: cfg.emoji, label: headerText || cfg.match,
            value: value, unit: cfg.unit, tierAchieved: t, tierNext: nt, note: cfg.note
          });
        }
      });
    }

    return { items: items, cashTotal: cashTotal, productTotal: productTotal, anyTier: anyTier, found: !!record, sheetExists: !!sheetData };
  }

  function renderSection(sectionKey, result){
    var panel = document.getElementById(sectionKey === 'bumun' ? 'panelBumun' : 'panelJiyeokdan');
    panel.innerHTML = '';

    if (!result.sheetExists){
      panel.innerHTML = '<div class="empty-tab">이 시트의 데이터를 불러오지 못했습니다.</div>';
      return;
    }
    if (!result.found){
      panel.innerHTML = '<div class="empty-tab">이 코드로 등록된 ' + CONFIG.sections[sectionKey].tabLabel + ' 실적이 없습니다.</div>';
      return;
    }
    if (result.items.length === 0){
      panel.innerHTML = '<div class="empty-tab">표시할 시상 항목이 없습니다.</div>';
      return;
    }

    var html = '';

    // 추천 말풍선: tier 항목 중 다음 구간이 있는 첫 항목
    var tipTarget = null;
    for (var i=0;i<result.items.length;i++){
      var it = result.items[i];
      if (it.configured && it.type === 'tier' && it.tierNext){ tipTarget = it; break; }
    }
    if (tipTarget){
      var remain = Math.round(tipTarget.tierNext.amount - tipTarget.value);
      html += '<div class="tip-card"><div class="tip-badge-row"><img class="tip-mascot" src="mascot.png" alt=""><span class="tip-badge">중부ON의 추천</span></div>';
      html += '<div class="tip-bubble">' + (tipTarget.tierAchieved ? ('지금 "' + tipTarget.label + '"으로 <span class="highlight">' + tipTarget.tierAchieved.reward + '</span>을 받고 있어요.') : ('"' + tipTarget.label + '"은 아직 시작 구간 전이에요.')) +
        '<br><br><span class="highlight">' + fmt(remain) + tipTarget.unit + '만 더 채우시면</span> "' + tipTarget.tierNext.reward + '"으로 업그레이드돼요! 🐾</div></div>';
    }

    html += '<div class="detail-section-title"><span class="bar"></span>항목별 상세</div>';

    result.items.forEach(function(it){
      if (!it.configured){
        html += '<div class="detail-card"><div class="detail-title-row"><span class="detail-title">' + escapeHtml(it.label) + '</span><span class="detail-amount">' + fmt(it.value) + '</span></div>' +
          '<div class="detail-tip warn">⚠ 이 항목은 아직 기준(CONFIG)이 설정되지 않았습니다. 스텝에게 문의해주세요.</div></div>';
        return;
      }
      if (it.type === 'threshold'){
        html += '<div class="detail-card"><div class="detail-title-row"><span class="detail-title">' + (it.emoji||'') + ' ' + escapeHtml(it.label) + '</span><span class="detail-amount">' + (it.achieved ? '인정' : '미인정') + '</span></div>' +
          '<div class="detail-sub">이번 실적 ' + fmt(it.value) + it.unit + ' · 기준 ' + fmt(it.threshold) + it.unit + ' 이상</div>' +
          '<div class="detail-tip' + (it.achieved ? ' done' : '') + '">' + (it.achieved ? (it.rewardText + ' 인정 완료! 🎉') : (fmt(it.remain) + it.unit + '만 더 채우면 ' + it.rewardText + '!')) + '</div></div>';
      } else {
        var achieved = it.tierAchieved;
        html += '<div class="detail-card"><div class="detail-title-row"><span class="detail-title">' + (it.emoji||'') + ' ' + escapeHtml(it.label) + '</span><span class="detail-amount">' + (achieved ? fmt(achieved.value) + '원' : '0원') + '</span></div>' +
          '<div class="detail-sub">이번 실적 ' + fmt(it.value) + it.unit + (achieved ? ' · ' + achieved.reward : '') + '</div>';
        if (it.tierNext){
          var r = Math.round(it.tierNext.amount - it.value);
          html += '<div class="detail-tip">' + fmt(r) + it.unit + '만 더 채우면 "' + it.tierNext.reward + '" 달성!</div>';
        } else {
          html += '<div class="detail-tip done">최고 구간 달성! 🎉</div>';
        }
        html += '</div>';
      }
    });

    if (result.anyTier){
      var grand = result.cashTotal + result.productTotal;
      html += '<div class="summary-table">';
      if (result.productTotal > 0) html += '<div class="breakdown-row"><span>🎁 물품시상 상당</span><b>' + fmt(result.productTotal) + '원</b></div>';
      if (result.cashTotal > 0) html += '<div class="breakdown-row"><span>💰 현금시상 합계</span><b>' + fmt(result.cashTotal) + '원</b></div>';
      html += '<div class="summary-divider"></div>';
      html += '<div class="summary-total-label">이 탭 예상 시상금 합계</div><div class="summary-total-amount">' + fmt(grand) + '원</div>';
      html += '</div>';
    }

    var section = CONFIG.sections[sectionKey];
    html += '<div class="basis-box">';
    section.items.forEach(function(cfg){
      html += '<p>' + (cfg.emoji||'') + ' ' + escapeHtml(cfg.note || cfg.match) + '</p>';
    });
    html += '</div>';

    panel.innerHTML = html;
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // ---- 탭 전환 ----
  document.getElementById('tabBtnBumun').addEventListener('click', function(){ switchTab('bumun'); });
  document.getElementById('tabBtnJiyeokdan').addEventListener('click', function(){ switchTab('jiyeokdan'); });
  function switchTab(key){
    document.getElementById('tabBtnBumun').classList.toggle('active', key === 'bumun');
    document.getElementById('tabBtnJiyeokdan').classList.toggle('active', key === 'jiyeokdan');
    document.getElementById('panelBumun').classList.toggle('active', key === 'bumun');
    document.getElementById('panelJiyeokdan').classList.toggle('active', key === 'jiyeokdan');
  }

  // ---- 조회 실행 ----
  document.getElementById('checkBtn').addEventListener('click', function(){
    var errEl = document.getElementById('inputError');
    errEl.classList.remove('show');

    if (loadFailed || !workbookData){
      errEl.textContent = '실적 데이터를 아직 불러오지 못했습니다. 잠시 후 다시 시도해주세요.';
      errEl.classList.add('show');
      return;
    }

    var raw = document.getElementById('inputCode').value;
    var code = normCode(raw);
    if (!code){
      errEl.textContent = '코드를 입력해주세요.';
      errEl.classList.add('show');
      return;
    }

    var bumunRecord = workbookData.bumun ? workbookData.bumun.rowsByCode[code] : null;
    var jiyeokdanRecord = workbookData.jiyeokdan ? workbookData.jiyeokdan.rowsByCode[code] : null;

    if (!bumunRecord && !jiyeokdanRecord){
      errEl.textContent = '코드를 다시 확인해 주세요.';
      errEl.classList.add('show');
      return;
    }

    var profileSource = bumunRecord || jiyeokdanRecord;
    document.getElementById('profileName').textContent = (profileSource.name || '') + ' 님';
    document.getElementById('profileOrg').textContent = [profileSource.branch, profileSource.team].filter(Boolean).join(' · ');

    var bumunResult = buildSectionResult('bumun', bumunRecord);
    var jiyeokdanResult = buildSectionResult('jiyeokdan', jiyeokdanRecord);
    renderSection('bumun', bumunResult);
    renderSection('jiyeokdan', jiyeokdanResult);
    switchTab('bumun');

    document.getElementById('inputCard').style.display = 'none';
    document.getElementById('resultWrap').classList.add('show');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  document.getElementById('inputCode').addEventListener('keydown', function(e){
    if (e.key === 'Enter') document.getElementById('checkBtn').click();
  });

  document.getElementById('backBtn').addEventListener('click', function(){
    document.getElementById('resultWrap').classList.remove('show');
    document.getElementById('inputCard').style.display = '';
    document.getElementById('inputCode').value = '';
    document.getElementById('inputError').classList.remove('show');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>
</body>
</html>
